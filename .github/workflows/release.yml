name: Release

# Push a tag (git tag v2.70.0-sam.2 && git push origin v2.70.0-sam.2) to build and publish binaries.
# Run it manually (Actions tab or `gh workflow run release.yml`) to test the builds without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 = older glibc, so the Linux binaries run on more distros
          - { os: ubuntu-22.04, name: linux-amd64, cmake: "" }
          - { os: ubuntu-22.04-arm, name: linux-arm64, cmake: "" }
          # one binary for Intel and Apple Silicon Macs; macos-latest has a C23-capable compiler
          - { os: macos-latest, name: macos-universal, cmake: '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # fastfetch needs C23; Ubuntu 22.04's default gcc is too old
      - if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update && sudo apt-get install -y gcc-13 libdrm-dev
          echo CC=gcc-13 >> "$GITHUB_ENV"
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release "${{ matrix.cmake }}" && cmake --build build -j
      - run: ./build/samfetch -s memory --logo none
      - run: tar czf samfetch-${{ matrix.name }}.tar.gz -C build samfetch -C .. LICENSE README.md
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: samfetch-${{ matrix.name }}.tar.gz

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          install: zip mingw-w64-clang-x86_64-cmake mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-ninja mingw-w64-clang-x86_64-directx-headers
      - run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build -j
      - run: ./build/samfetch.exe -s memory --logo none
      - run: zip -j samfetch-windows-amd64.zip build/samfetch.exe LICENSE README.md
      - uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: samfetch-windows-amd64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [unix, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: samfetch ${{ github.ref_name }}
          files: |
            samfetch-*.tar.gz
            samfetch-*.zip
